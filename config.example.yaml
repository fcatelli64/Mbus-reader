# Copia questo file in config.yaml e adattalo.

serial:
  # Meglio il percorso stabile: ls -l /dev/serial/by-id/
  port: /dev/ttyUSB0
  baudrate: 2400        # il SensoStar 2 esce di fabbrica a 2400 baud (8E1)
  timeout: 3
  retries: 3

# Secondi tra un giro di letture e il successivo (vedi README: batteria!)
poll_interval: 900

# Un blocco per ogni contabilizzatore sul bus. Il nome diventa il nome del
# dispositivo in Home Assistant e determina gli entity_id: sceglilo subito
# e non cambiarlo più (es. "Calore Interno 1" -> sensor.calore_interno_1_energia).
# secondary_address = numero di serie stampato sul frontale del contatore.
meters:
  - name: Calore Interno 1
    secondary_address: "61382914"
  # - name: Calore Interno 2
  #   secondary_address: "........"

mqtt:
  host: homeassistant.local   # IP o nome dell'istanza Home Assistant (broker Mosquitto)
  port: 1883
  username: mbus
  password: cambiami          # oppure variabile d'ambiente MQTT_PASSWORD
  base_topic: mbus
  discovery_prefix: homeassistant
